[project]
name = "technical-debt-intelligence-backend"
version = "0.1.0"
description = "Technical Debt Intelligence & Governance PoC backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0,<2.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "networkx==3.6.1",
    "pydantic-settings>=2.0.0",
    "pyodbc>=5.0.0,<6.0",
    "sqlalchemy>=2.0.0,<3.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pydriller==2.10",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "semgrep==1.175.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "external: requires a live external HTTP source",
    "integration: requires externally configured infrastructure",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
include = ["app*"]
